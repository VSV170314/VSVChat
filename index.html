<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <meta
        name="description"
        content="VSVChat - Connect. Chat. Create."
    >

    <title>VSVChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         AUTH SCREEN
    ========================================== -->

    <section id="authScreen">

        <div class="auth-card">

            <h1>VSVCHAT</h1>

            <p>Connect. Chat. Create.</p>

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                maxlength="20"
                spellcheck="false"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                maxlength="100"
            >

            <div class="auth-buttons">

                <button
                    id="loginBtn"
                    type="button"
                >
                    Login
                </button>

                <button
                    id="signupBtn"
                    type="button"
                >
                    Create Account
                </button>

            </div>

            <div
                id="authStatus"
                aria-live="polite"
            ></div>

        </div>

    </section>


    <!-- =========================================
         CHAT SCREEN
    ========================================== -->

    <section
        id="chatScreen"
        style="display: none;"
    >

        <!-- TOP BAR -->

        <header class="top-bar">

            <div class="logo">
                VSVCHAT
            </div>

            <div class="user-area">

                <span id="currentUser">
                    @user
                </span>

                <button
                    id="logoutBtn"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </header>


        <!-- CHAT LAYOUT -->

        <div class="chat-layout">

            <!-- =====================================
                 CHAT SIDEBAR
            ====================================== -->

            <aside class="chat-sidebar">

                <div class="sidebar-title">
                    CHANNELS
                </div>


                <!-- GENERAL -->

                <button
                    id="generalBtn"
                    class="chatButton"
                    type="button"
                >
                    # GENERAL
                </button>


                <!-- USER'S JOINED CHATS -->

                <div id="chatList"></div>


                <!-- CREATE / JOIN -->

                <div class="sidebar-actions">

                    <button
                        id="createChatBtn"
                        type="button"
                    >
                        + Create
                    </button>

                    <button
                        id="joinChatBtn"
                        type="button"
                    >
                        + Join
                    </button>

                </div>

            </aside>


            <!-- =====================================
                 MAIN CHAT
            ====================================== -->

            <main class="chat-main">

                <!-- CHAT HEADER -->

                <header class="chat-header">

                    <div
                        id="chatTitle"
                        title="Current chat"
                    >
                        # GENERAL
                    </div>

                    <div
                        id="chatCode"
                        title="Chat information"
                    >
                        Everyone can join this chat.
                    </div>

                </header>


                <!-- MESSAGES -->

                <div
                    id="messages"
                    aria-live="polite"
                    aria-label="Chat messages"
                ></div>


                <!-- MESSAGE INPUT -->

                <div class="input-area">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Type a message..."
                        autocomplete="off"
                        maxlength="2000"
                        spellcheck="true"
                    >

                    <button
                        id="sendBtn"
                        type="button"
                    >
                        Send
                    </button>

                </div>

            </main>

        </div>

    </section>


    <!-- =========================================
         CREATE CHAT MODAL
    ========================================== -->

    <div
        id="createChatModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="createChatTitle"
    >

        <div class="modal-content">

            <h2 id="createChatTitle">
                Create Chat
            </h2>

            <input
                type="text"
                id="newChatName"
                placeholder="Chat name"
                maxlength="40"
                autocomplete="off"
            >

            <input
                type="password"
                id="newChatPassword"
                placeholder="Chat password"
                maxlength="100"
                autocomplete="new-password"
            >

            <div class="modal-buttons">

                <button
                    id="confirmCreateChat"
                    type="button"
                >
                    Create
                </button>

                <button
                    id="cancelCreateChat"
                    type="button"
                >
                    Cancel
                </button>

            </div>

            <div
                id="createStatus"
                aria-live="polite"
            ></div>

        </div>

    </div>


    <!-- =========================================
         JOIN CHAT MODAL
    ========================================== -->

    <div
        id="joinChatModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="joinChatTitle"
    >

        <div class="modal-content">

            <h2 id="joinChatTitle">
                Join Chat
            </h2>

            <input
                type="text"
                id="chatCodeInput"
                placeholder="Chat code"
                maxlength="6"
                autocomplete="off"
                spellcheck="false"
            >

            <input
                type="password"
                id="joinChatPassword"
                placeholder="Chat password"
                maxlength="100"
                autocomplete="current-password"
            >

            <div class="modal-buttons">

                <button
                    id="confirmJoinChat"
                    type="button"
                >
                    Join
                </button>

                <button
                    id="cancelJoinChat"
                    type="button"
                >
                    Cancel
                </button>

            </div>

            <div
                id="joinStatus"
                aria-live="polite"
            ></div>

        </div>

    </div>


    <!-- =========================================
         FIREBASE + VSVCHAT JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
