<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VSVChat</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================================
         LOGIN / ACCOUNT CREATION
    ========================================== -->

    <div
        id="authScreen"
        class="container-fluid min-vh-100 d-flex align-items-center justify-content-center px-3"
    >

        <div class="authBox w-100" style="max-width: 450px;">

            <h1>VSVCHAT</h1>

            <p class="subtitle">
                CONNECT. CHAT. CREATE.
            </p>

            <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Username"
                maxlength="20"
                autocomplete="username"
            >

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                id="loginBtn"
                class="btn w-100"
            >
                LOGIN
            </button>

            <button
                id="signupBtn"
                class="btn w-100"
            >
                CREATE ACCOUNT
            </button>

            <p id="authStatus"></p>

        </div>

    </div>


    <!-- =========================================
         MAIN CHAT APPLICATION
    ========================================== -->

    <div
        id="chatScreen"
        class="container-fluid vh-100 p-0"
        style="display: none;"
    >

        <!-- TOP BAR -->

        <header class="topBar row g-0 align-items-center">

            <div class="col">

                <h1>
                    VSVCHAT
                </h1>

                <span id="currentUser"></span>

            </div>

            <div class="col-auto">

                <button
                    id="logoutBtn"
                    class="btn"
                >
                    LOGOUT
                </button>

            </div>

        </header>


        <!-- MAIN CHAT LAYOUT -->

        <main class="chatLayout row g-0">


            <!-- =================================
                 CHAT SIDEBAR
            ================================== -->

            <aside
                class="chatSidebar col-12 col-md-3 col-lg-3 col-xl-2"
            >

                <h2>
                    CHATS
                </h2>


                <!-- GENERAL -->

                <button
                    id="generalBtn"
                    class="chatButton btn w-100 text-start"
                >
                    # GENERAL
                </button>


                <!-- CUSTOM CHATS -->

                <div id="chatList"></div>


                <!-- CHAT ACTIONS -->

                <div class="chatActions">

                    <button
                        id="createChatBtn"
                        class="btn w-100"
                    >
                        + CREATE CHAT
                    </button>

                    <button
                        id="joinChatBtn"
                        class="btn w-100"
                    >
                        JOIN CHAT
                    </button>

                </div>

            </aside>


            <!-- =================================
                 MAIN CHAT AREA
            ================================== -->

            <section
                class="chatArea col-12 col-md-9 col-lg-9 col-xl-10"
            >


                <!-- CHAT HEADER -->

                <div class="chatHeader">

                    <div>

                        <h2 id="chatTitle">
                            # GENERAL
                        </h2>

                        <span id="chatCode"></span>

                    </div>

                </div>


                <!-- MESSAGES -->

                <div id="messages"></div>


                <!-- MESSAGE INPUT -->

                <div class="messageBar">

                    <input
                        type="text"
                        id="messageInput"
                        class="form-control"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >

                    <button
                        id="sendBtn"
                        class="btn"
                    >
                        SEND
                    </button>

                </div>

            </section>

        </main>

    </div>


    <!-- =========================================
         CREATE CHAT MODAL
    ========================================== -->

    <div
        id="createChatModal"
        class="modal"
        style="display: none;"
    >

        <div
            class="modalBox container-fluid"
            style="max-width: 450px;"
        >

            <h2>
                CREATE CHAT
            </h2>


            <input
                type="text"
                id="newChatName"
                class="form-control"
                placeholder="Chat name"
                maxlength="30"
                autocomplete="off"
            >


            <input
                type="password"
                id="newChatPassword"
                class="form-control"
                placeholder="Chat password"
                maxlength="50"
                autocomplete="new-password"
            >


            <button
                id="confirmCreateChat"
                class="btn w-100"
            >
                CREATE
            </button>


            <button
                id="cancelCreateChat"
                class="btn w-100"
            >
                CANCEL
            </button>


            <p id="createStatus"></p>

        </div>

    </div>


    <!-- =========================================
         JOIN CHAT MODAL
    ========================================== -->

    <div
        id="joinChatModal"
        class="modal"
        style="display: none;"
    >

        <div
            class="modalBox container-fluid"
            style="max-width: 450px;"
        >

            <h2>
                JOIN CHAT
            </h2>


            <input
                type="text"
                id="chatCodeInput"
                class="form-control"
                placeholder="Enter chat code"
                maxlength="6"
                autocomplete="off"
            >


            <input
                type="password"
                id="joinChatPassword"
                class="form-control"
                placeholder="Chat password"
                maxlength="50"
                autocomplete="current-password"
            >


            <button
                id="confirmJoinChat"
                class="btn w-100"
            >
                JOIN
            </button>


            <button
                id="cancelJoinChat"
                class="btn w-100"
            >
                CANCEL
            </button>


            <p id="joinStatus"></p>

        </div>

    </div>


    <!-- =========================================
         BOOTSTRAP JS
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =========================================
         VSVCHAT JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
